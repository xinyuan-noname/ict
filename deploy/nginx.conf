worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  upstream authd_upstream {
    server authd:8443;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # App 是单页应用；刷新任意路径都回到 index.html。
    location / {
      try_files $uri $uri/ /index.html;
    }

    # 带指纹的静态资源长期缓存，index.html 不缓存。
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location = /index.html {
      add_header Cache-Control "no-store";
    }

    # 同源 API 反代：浏览器只访问 80/443，避免 CORS。
    location /v1/ {
      proxy_pass http://authd_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $request_id;
      proxy_read_timeout 20s;
    }

    location = /readyz {
      proxy_pass http://authd_upstream;
      proxy_set_header Host $host;
    }

    location /assets/frames/ {
      proxy_pass http://authd_upstream;
      proxy_set_header Host $host;
      expires 7d;
    }

    # 云上 HTTPS 建议在 ELB / WAF 终止；如直接在 ECS 终止，挂载证书后启用 443 server。
  }
}
