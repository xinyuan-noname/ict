<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c7000b" />
  <title>check</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #eef0f4;
      display: flex;
      justify-content: center;
      align-items: stretch;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* RNW 把应用挂到 #root 下的 div；这里补全 flex 链，否则 flex:1 失效、底栏随内容浮动 */
    #root {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
      overflow: hidden;
    }
    #root > div {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 480px) {
      #root { box-shadow: none; }
    }
    img { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
