  <meta name="description" content="check · 每日健康清单：饮水、服药、运动与英语，一份真正能坚持的清单。" />
  <title>check · 每日健康清单</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #0b0e14;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    /* RNW 把应用挂到 #root 下的 div；这里补全 flex 链，否则 flex:1 失效、底栏随内容浮动 */
    #root {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #root > div {
      /* 用绝对定位铺满 #root，绕过 RNW 挂载层的 flex 高度链 */
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    img { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
